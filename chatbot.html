<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maid Service Chatbot</title>
    <style>
        /* Basic styling for the chatbot interface */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .chat-container {
            position: fixed;
            bottom: 0;
            right: 20px;
            width: 300px;
            max-height: 500px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 18px;
        }

        .chat-body {
            padding: 10px;
            flex: 1;
            overflow-y: auto;
        }

        .chat-footer {
            display: flex;
            flex-direction: column;
            border-top: 1px solid #ddd;
            padding: 10px;
        }

        .chat-input-container {
            display: flex;
        }

        .chat-input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            outline: none;
        }

        .send-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            margin-left: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .suggestion {
            background-color: #f1f1f1;
            color: #333;
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            border: 1px solid #ccc;
        }

        .suggestion:hover {
            background-color: #007bff;
            color: white;
        }

        .chat-message {
            margin-bottom: 10px;
        }

        .user-message {
            text-align: right;
            color: #007bff;
        }

        .bot-message {
            text-align: left;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Chatbot Container -->
    <div class="chat-container">
        <div class="chat-header">Maid Service Chatbot</div>
        <div class="chat-body" id="chatBody">
            <!-- Chat messages will appear here -->
        </div>
        <div class="chat-footer">
            <div class="chat-input-container">
                <input type="text" class="chat-input" id="userInput" placeholder="Type your message...">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
            <div class="suggestions" id="suggestions">
                <!-- Suggestions will appear here -->
            </div>
        </div>
    </div>

    <script>
        const chatBody = document.getElementById("chatBody");
        const suggestionsDiv = document.getElementById("suggestions");

        // Initial welcome message
        addBotMessage("Hi! I'm your Maid Service assistant. How can I help you today?");
        showSuggestions(["What services do you offer?", "Book a cleaning service", "What are your prices?", "Thank you"]);

        let bookingDetails = {
            service: null,
            day: null,
            time: null
        };

        // Function to handle sending a message
        function sendMessage() {
            const userInput = document.getElementById("userInput").value;
            if (userInput.trim() === "") return;

            addUserMessage(userInput);
            processResponse(userInput.toLowerCase());

            document.getElementById("userInput").value = ""; // Clear input
        }

        // Add user message to chat
        function addUserMessage(message) {
            const messageElement = document.createElement("div");
            messageElement.className = "chat-message user-message";
            messageElement.innerText = message;
            chatBody.appendChild(messageElement);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // Add bot message to chat
        function addBotMessage(message) {
            const messageElement = document.createElement("div");
            messageElement.className = "chat-message bot-message";
            messageElement.innerText = message;
            chatBody.appendChild(messageElement);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // Process user input and respond
        function processResponse(input) {
            if (input.includes("service") || input.includes("help")) {
                addBotMessage("We offer the following services: Apartment Cleaning, Office Cleaning, House Cleaning, Car Washing, Green Cleaning, and Maintenance Service. What would you like to do?");
                showSuggestions(["Book Apartment Cleaning", "Book Office Cleaning", "Book House Cleaning", "Book Car Washing", "Book Green Cleaning", "Book Maintenance Service", "What are your prices?"]);
            } 
            else if (input.includes("book apartment cleaning")) {
                bookingDetails.service = "Apartment Cleaning";
                bookService();
            } 
            else if (input.includes("book office cleaning")) {
                bookingDetails.service = "Office Cleaning";
                bookService();
            } 
            else if (input.includes("book house cleaning")) {
                bookingDetails.service = "House Cleaning";
                bookService();
            } 
            else if (input.includes("book car washing")) {
                bookingDetails.service = "Car Washing";
                bookService();
            } 
            else if (input.includes("book green cleaning")) {
                bookingDetails.service = "Green Cleaning";
                bookService();
            } 
            else if (input.includes("book maintenance service")) {
                bookingDetails.service = "Maintenance Service";
                bookService();
            } 
            else if (input.includes("what are your prices")) {
                addBotMessage("Our rates vary by service. Please ask about specific services for pricing.");
                showSuggestions(["Book Apartment Cleaning", "Book Office Cleaning", "Book House Cleaning", "Book Car Washing", "Book Green Cleaning", "Book Maintenance Service"]);
            } 
            else if (isDayOfWeek(input)) {
                bookingDetails.day = input.charAt(0).toUpperCase() + input.slice(1);
                addBotMessage(`You've selected ${bookingDetails.day}. Please select a time slot for your booking:`);
                showTimeSlots();
            } 
            else if (isTimeSlot(input)) {
                bookingDetails.time = input;
                addBotMessage(`You've selected ${bookingDetails.time}. Please confirm your booking:`);
                showSuggestions(["Confirm booking", "Change time", "Change date"]);
            } 
            else if (input.includes("confirm booking")) {
                addBotMessage(`Booking confirmed for ${bookingDetails.service} on ${bookingDetails.day} at ${bookingDetails.time}. Please proceed to make your payment.`);
                showSuggestions(["Make Payment", "Start a new conversation"]);
            } 
            else if (input.includes("make payment")) {
                window.location.href = "book.html"; // Redirect to book.html
            } 
            else if (input.includes("change date")) {
                addBotMessage("Please select a new date for your booking:");
                showDaysOfWeek();
            }
            else if (input.includes("change time")) {
                addBotMessage("Please select a new time slot for your booking:");
                showTimeSlots();
            }
            else {
                addBotMessage("Sorry, I didn't understand that. Could you please rephrase?");
                showSuggestions(["What services do you offer?", "Book a cleaning service", "What are your prices?", "Help"]);
            }
        }

        // Function to check if input is a day of the week
        function isDayOfWeek(input) {
            const daysOfWeek = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
            return daysOfWeek.includes(input);
        }

        // Function to check if input is a time slot
        function isTimeSlot(input) {
            const timeSlots = ["8am", "10am", "12pm", "2pm", "4pm", "6pm", "8pm"];
            return timeSlots.includes(input);
        }

        // Function to show time slots
        function showTimeSlots() {
            const timeSlots = ["8am", "10am", "12pm", "2pm", "4pm", "6pm", "8pm"];
            showSuggestions(timeSlots);
        }

        // Function to show days of the week
        function showDaysOfWeek() {
            const daysOfWeek = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
            showSuggestions(daysOfWeek);
        }

        // Function to initiate service booking
        function bookService() {
            addBotMessage(`You've selected ${bookingDetails.service}. Please select a day for your booking.`);
            showDaysOfWeek();
        }

        // Function to show suggestions
        function showSuggestions(suggestions) {
            suggestionsDiv.innerHTML = ''; // Clear previous suggestions
            suggestions.forEach(suggestion => {
                const suggestionElement = document.createElement("div");
                suggestionElement.className = "suggestion";
                suggestionElement.innerText = suggestion;
                suggestionElement.onclick = () => selectSuggestion(suggestion);
                suggestionsDiv.appendChild(suggestionElement);
            });
        }

        // Handle selecting a suggestion
        function selectSuggestion(suggestion) {
            document.getElementById("userInput").value = suggestion;
            sendMessage();
        }
        function confirmBooking() {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'store_booking.php', true);
    xhr.setRequestHeader('Content-type', 'application/x-www-form-urlencoded');

    // Prepare booking details to send
    const params = `day=${encodeURIComponent(bookingDetails.day)}&time=${encodeURIComponent(bookingDetails.time)}&service=${encodeURIComponent(bookingDetails.service)}`;
    

    xhr.onload = function () {
        if (this.status === 200) {
            const response = JSON.parse(this.responseText);
            if (response.success) {
                addBotMessage("Booking saved successfully.");
            } else {
                addBotMessage(`Error: ${response.message}`);
            }
        }
    };
    xhr.send(params);
}
        
    </script>

</body>
</html>
